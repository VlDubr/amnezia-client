# Amnezia Panel: Caddy (TLS + web UI) -> backend (FastAPI + worker) -> PostgreSQL, plus daily backups.
# Usage: cp .env.example .env && edit it, then `docker compose up -d --build` from this directory.
name: amnezia-panel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: panel/backend/Dockerfile
    restart: unless-stopped
    environment:
      PANEL_DATABASE_URL: postgresql+asyncpg://panel:${POSTGRES_PASSWORD}@db:5432/panel
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:?set PANEL_MASTER_KEY in .env}
      PANEL_TZ: ${PANEL_TZ:-UTC}
      PANEL_DNS1: ${PANEL_DNS1:-1.1.1.1}
      PANEL_DNS2: ${PANEL_DNS2:-1.0.0.1}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: ../..
      dockerfile: panel/deploy/Caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U panel -d panel | gzip > /backups/panel-$$(date +%Y%m%d-%H%M%S).sql.gz \
            && find /backups -name 'panel-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
