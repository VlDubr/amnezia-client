[project]
name = "amnezia-panel"
version = "0.1.0"
description = "Amnezia Panel backend: users, configs and servers management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "asyncssh>=2.17",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "zxcvbn>=4.4.28",
    "cryptography>=43",
    "segno>=1.6",
]

[project.scripts]
panel = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker and real Amnezia containers"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
